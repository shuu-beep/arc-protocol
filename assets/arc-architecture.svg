<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" role="img" aria-label="ARC layer diagram">
  <title>Where ARC sits</title>
  <desc>Humans hold final approval at the top. ARC is the human-approval and authority layer beneath them, coordinating heterogeneous agents such as Claude Code, Codex, and Qwen Code, and riding on existing tool, interop, and payment layers without replacing them.</desc>
  <rect x="0" y="0" width="880" height="390" rx="10" fill="#F4EFE3"/>

  <rect x="320" y="24" width="240" height="52" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
  <text x="440" y="48" text-anchor="middle" font-family="'Spectral', Georgia, serif" font-size="18" fill="#14110C">You</text>
  <text x="440" y="65" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="12" fill="#5C544A">final approval · sets policy</text>

  <path d="M 440 78 L 440 104" fill="none" stroke="#C26A2E" stroke-width="1.5"/>
  <path d="M 435 99 L 440 105 L 445 99" fill="none" stroke="#C26A2E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="24" y="108" width="832" height="104" rx="8" fill="#F6E4CF" stroke="#C26A2E" stroke-width="1.5"/>
  <text x="56" y="156" font-family="'Spectral', Georgia, serif" font-size="42" fill="#14110C">ARC</text>
  <text x="56" y="180" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="12" fill="#9A5F2A">the human-approval &amp; authority layer</text>

  <g font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="12">
    <rect x="200" y="124" width="120" height="30" rx="15" fill="#F4EFE3" stroke="#C26A2E"/>
    <text x="260" y="143" text-anchor="middle" fill="#14110C">Human approval</text>
    <rect x="328" y="124" width="120" height="30" rx="15" fill="#F4EFE3" stroke="#C26A2E"/>
    <text x="388" y="143" text-anchor="middle" fill="#14110C">Authority</text>
    <rect x="456" y="124" width="120" height="30" rx="15" fill="#F4EFE3" stroke="#C26A2E"/>
    <text x="516" y="143" text-anchor="middle" fill="#14110C">Delegation</text>
    <rect x="584" y="124" width="120" height="30" rx="15" fill="#F4EFE3" stroke="#C26A2E"/>
    <text x="644" y="143" text-anchor="middle" fill="#14110C">Revocation</text>
    <rect x="712" y="124" width="120" height="30" rx="15" fill="#F4EFE3" stroke="#C26A2E"/>
    <text x="772" y="143" text-anchor="middle" fill="#14110C">Auditability</text>
  </g>

  <text x="200" y="200" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11.5" fill="#9A5F2A">signed events in · projections out · never a stored score</text>

  <text x="24" y="240" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="12" fill="#5C544A">heterogeneous agents — any model, any company</text>

  <g font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="13">
    <rect x="24" y="248" width="156" height="44" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
    <text x="102" y="275" text-anchor="middle" fill="#14110C">Claude Code</text>
    <rect x="192" y="248" width="156" height="44" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
    <text x="270" y="275" text-anchor="middle" fill="#14110C">Codex</text>
    <rect x="360" y="248" width="156" height="44" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
    <text x="438" y="275" text-anchor="middle" fill="#14110C">Qwen Code</text>
    <rect x="528" y="248" width="156" height="44" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
    <text x="606" y="275" text-anchor="middle" fill="#14110C">vendor agent</text>
    <rect x="696" y="248" width="156" height="44" rx="6" fill="#ECE6D6" stroke="#C9BFA8"/>
    <text x="774" y="275" text-anchor="middle" fill="#14110C">personal agent</text>
  </g>

  <rect x="24" y="316" width="832" height="50" rx="6" fill="none" stroke="#B8AE98" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="440" y="338" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="12" fill="#7C7466">rides on existing layers — MCP · A2A · checkout · payment · ledger</text>
  <text x="440" y="356" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="11" fill="#8B8275">ARC uses these layers; it does not replace them</text>
</svg>
