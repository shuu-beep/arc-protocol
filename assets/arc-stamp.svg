<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-label="Verified, signed by community — no central issuer. Any agent. Any model. Any company. Human approval required.">
  <title>ARC verified stamp</title>
  <rect x="0.5" y="0.5" width="599" height="199" rx="24" fill="#F4EFE3" stroke="#E2DBC8"/>

  <g transform="translate(16 0)">
    <!-- seal (left), hand-stamped tilt -->
    <g transform="rotate(-11 100 100)">
      <circle cx="100" cy="100" r="92" fill="none" stroke="#2F6A4A" stroke-width="2"/>
      <circle cx="100" cy="100" r="84" fill="none" stroke="#2F6A4A" stroke-width="1" stroke-dasharray="2 4"/>
      <defs>
        <path id="arcTop" d="M 25 100 A 75 75 0 0 1 175 100" fill="none"/>
        <path id="arcBot" d="M 30 105 A 70 70 0 0 0 170 105" fill="none"/>
      </defs>
      <text fill="#2F6A4A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="0.32em">
        <textPath href="#arcTop" startOffset="50%" text-anchor="middle">VERIFIED · ARC PROTOCOL</textPath>
      </text>
      <text fill="#2F6A4A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" letter-spacing="0.32em">
        <textPath href="#arcBot" startOffset="50%" text-anchor="middle">SIGNED BY COMMUNITY</textPath>
      </text>
      <g transform="translate(60 78)">
        <path d="M 8 32 A 32 32 0 0 1 72 32" fill="none" stroke="#2F6A4A" stroke-width="3" stroke-linecap="round"/>
        <circle cx="8" cy="32" r="6" fill="#2F6A4A"/>
        <circle cx="72" cy="32" r="6" fill="#2F6A4A"/>
      </g>
      <text x="100" y="138" text-anchor="middle" fill="#2F6A4A" font-family="'Spectral', Georgia, serif" font-weight="500" font-size="18" letter-spacing="0.18em">SIGNED</text>
    </g>

    <!-- divider -->
    <line x1="216" y1="46" x2="216" y2="154" stroke="#E2DBC8" stroke-width="1"/>

    <!-- caption (right) -->
    <text x="240" y="68" fill="#5C544A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" letter-spacing="0.24em">NO CENTRAL ISSUER</text>
    <text x="238" y="106" fill="#14110C" font-family="'Spectral', Georgia, serif" font-weight="500" font-size="22">Any agent. Any model.</text>
    <text x="238" y="135" fill="#14110C" font-family="'Spectral', Georgia, serif" font-weight="500" font-size="22">Any company.</text>
    <text x="238" y="170" fill="#2F6A4A" font-family="'Spectral', Georgia, serif" font-weight="600" font-size="22">Human approval required.</text>
  </g>
</svg>
