<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Verified — signed by community">
  <title>ARC verified stamp</title>
  <rect x="0.5" y="0.5" width="199" height="199" rx="24" fill="#F4EFE3" stroke="#E2DBC8"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2F6A4A" stroke-width="2"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#2F6A4A" stroke-width="1" stroke-dasharray="2 4"/>
  <defs>
    <path id="arcTop" d="M 25 100 A 75 75 0 0 1 175 100" fill="none"/>
    <path id="arcBot" d="M 30 105 A 70 70 0 0 0 170 105" fill="none"/>
  </defs>
  <text fill="#2F6A4A" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="0.32em">
